<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1410">
<title>مطعم الشام — المنيو</title>
<meta name="description" content="منيو إلكتروني — مطعم الشام، دمشق">
<style>
  :root{
    --bg:#1a1410; --card:#241c17; --line:#3a2e26;
    --text:#f5efe8; --muted:#a99584;
    --gold:#d4a24c; --green:#25d366;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    font-family:-apple-system,"Segoe UI",Roboto,"Noto Naskh Arabic",Tahoma,sans-serif;
    background:var(--bg);color:var(--text);padding-bottom:86px;
  }

  header{
    text-align:center;padding:34px 20px 26px;
    background:linear-gradient(180deg,#2b211a,var(--bg));
    border-bottom:1px solid var(--line);
  }
  .logo{
    width:76px;height:76px;margin:0 auto 14px;border-radius:50%;
    background:linear-gradient(145deg,var(--gold),#8a5f22);
    display:grid;place-items:center;font-size:34px;
  }
  h1{font-size:1.72rem;margin-bottom:5px}
  .tag{color:var(--gold);font-size:.9rem;margin-bottom:12px}
  .meta{color:var(--muted);font-size:.83rem;line-height:1.9}
  .open{
    display:inline-flex;align-items:center;gap:6px;margin-top:9px;
    background:rgba(37,211,102,.13);color:var(--green);
    border:1px solid rgba(37,211,102,.3);
    padding:5px 12px;border-radius:20px;font-size:.79rem;
  }
  .open i{width:7px;height:7px;border-radius:50%;background:var(--green)}

  nav{
    position:sticky;top:0;z-index:20;display:flex;gap:8px;
    overflow-x:auto;padding:12px 14px;background:rgba(26,20,16,.97);
    border-bottom:1px solid var(--line);backdrop-filter:blur(8px);
    -webkit-overflow-scrolling:touch;scrollbar-width:none;
  }
  nav::-webkit-scrollbar{display:none}
  nav button{
    flex-shrink:0;font:inherit;font-size:.85rem;cursor:pointer;
    background:var(--card);color:var(--muted);
    border:1px solid var(--line);border-radius:20px;padding:8px 16px;
  }
  nav button.on{background:var(--gold);color:#2b1c06;border-color:var(--gold);font-weight:600}

  main{padding:20px 14px}
  section{margin-bottom:30px}
  h2{
    font-size:1.16rem;margin-bottom:14px;padding-right:11px;
    border-right:3px solid var(--gold);
  }
  .item{
    display:flex;gap:13px;align-items:flex-start;
    background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:14px;margin-bottom:11px;
  }
  .ico{
    width:52px;height:52px;flex-shrink:0;border-radius:11px;
    background:#332720;display:grid;place-items:center;font-size:25px;
  }
  .info{flex:1;min-width:0}
  .info b{display:block;font-size:1rem;margin-bottom:4px}
  .info p{color:var(--muted);font-size:.82rem;line-height:1.6}
  .price{
    flex-shrink:0;color:var(--gold);font-weight:700;font-size:1rem;
    white-space:nowrap;align-self:center;
  }
  .badge{
    display:inline-block;background:rgba(212,162,76,.16);color:var(--gold);
    font-size:.68rem;padding:2px 7px;border-radius:5px;margin-right:5px;
  }

  .bar{
    position:fixed;bottom:0;left:0;right:0;z-index:30;
    display:flex;gap:9px;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));
    background:rgba(36,28,23,.98);border-top:1px solid var(--line);
    backdrop-filter:blur(8px);
  }
  .bar a{
    flex:1;text-decoration:none;text-align:center;
    padding:13px;border-radius:12px;font-weight:700;font-size:.94rem;
  }
  .wa{background:var(--green);color:#04310f}
  .call{background:transparent;color:var(--gold);border:1px solid var(--gold)}

  footer{text-align:center;padding:18px 14px;color:var(--muted);font-size:.75rem;line-height:1.9}
  .demo{
    background:rgba(212,162,76,.1);border:1px dashed var(--gold);
    border-radius:11px;padding:12px;margin:0 14px 18px;
    color:var(--gold);font-size:.79rem;text-align:center;line-height:1.8;
  }
</style>
</head>
<body>

<header>
  <div class="logo">🍽️</div>
  <h1>مطعم الشام</h1>
  <div class="tag">مأكولات شرقية · شاورما · مشاوي</div>
  <div class="meta">
    شارع الحمرا، دمشق<br>
    يومياً ١١:٠٠ ص – ١٢:٠٠ م
  </div>
  <div class="open"><i></i> مفتوح الآن</div>
</header>

<div class="demo">
  هذا نموذج توضيحي — الأسماء والأسعار تجريبية
</div>

<nav id="nav"></nav>
<main id="main"></main>

<div class="bar">
  <a class="wa" href="https://wa.me/963900000000?text=%D9%85%D8%B1%D8%AD%D8%A8%D8%A7%D8%8C%20%D8%A8%D8%AF%D9%8A%20%D8%A3%D8%B7%D9%84%D8%A8" target="_blank" rel="noopener">اطلب على واتساب</a>
  <a class="call" href="tel:+963900000000">اتصل</a>
</div>

<footer>
  مطعم الشام · دمشق<br>
  منيو إلكتروني
</footer>

<script>
(function(){
  var MENU = [
    { cat:'الأكثر طلباً', items:[
      { n:'شاورما عربي', d:'خبز عربي، دجاج مشوي، ثومية، مخلل', p:'١٥٫٠٠٠', i:'🌯', b:'الأشهر' },
      { n:'مشاوي مشكل', d:'شيش طاووق، كباب، كفتة، مع أرز وسلطة', p:'٦٥٫٠٠٠', i:'🍖', b:'يكفي شخصين' },
      { n:'كبة لبنية', d:'كبة مطبوخة باللبن، أرز، صنوبر', p:'٨٠٫٠٠٠', i:'🍛', b:'طلب مسبق' }
    ]},
    { cat:'المقبلات', items:[
      { n:'حمص بالطحينة', d:'حمص، طحينة، زيت زيتون، صنوبر', p:'١٠٫٠٠٠', i:'🥣' },
      { n:'متبل باذنجان', d:'باذنجان مشوي على الفحم، طحينة، ليمون', p:'١٢٫٠٠٠', i:'🍆' },
      { n:'فتوش', d:'خضار موسمية، خبز محمّص، دبس رمان، سمّاق', p:'١٤٫٠٠٠', i:'🥗' },
      { n:'ورق عنب', d:'محشي أرز ولحمة، مطبوخ على نار هادئة', p:'٢٢٫٠٠٠', i:'🍃' }
    ]},
    { cat:'الأطباق الرئيسية', items:[
      { n:'شيش طاووق', d:'صدر دجاج متبّل، مشوي على الفحم، مع أرز', p:'٤٥٫٠٠٠', i:'🍗' },
      { n:'كباب لحمة', d:'لحم بقري مفروم بالبقدونس والبصل', p:'٥٠٫٠٠٠', i:'🥩' },
      { n:'ريش غنم', d:'ريش طرية مشوية، مع بطاطا وسلطة', p:'٧٥٫٠٠٠', i:'🍖' },
      { n:'صيادية سمك', d:'سمك مشوي، أرز بالبصل، طحينة', p:'٦٨٫٠٠٠', i:'🐟' }
    ]},
    { cat:'المشروبات', items:[
      { n:'عيران', d:'لبن مخفوق بالنعنع والملح', p:'٦٫٠٠٠', i:'🥛' },
      { n:'ليمون بالنعنع', d:'ليمون طازج مفروم بالنعنع', p:'١٠٫٠٠٠', i:'🍋' },
      { n:'شاي بالنعنع', d:'شاي أحمر بالنعنع الطازج', p:'٥٫٠٠٠', i:'🍵' },
      { n:'قهوة عربية', d:'قهوة مطحونة بالهيل', p:'٦٫٠٠٠', i:'☕' }
    ]},
    { cat:'الحلويات', items:[
      { n:'كنافة نابلسية', d:'جبنة، كنافة، قطر، فستق', p:'٢٠٫٠٠٠', i:'🍮', b:'طازج يومياً' },
      { n:'بقلاوة', d:'تشكيلة بقلاوة بالفستق والجوز', p:'١٥٫٠٠٠', i:'🥮' },
      { n:'مهلبية', d:'مهلبية بالحليب والماء الورد', p:'١٢٫٠٠٠', i:'🍨' }
    ]}
  ];

  var nav = document.getElementById('nav');
  var main = document.getElementById('main');

  function slug(i){ return 'c' + i; }

  MENU.forEach(function(group, gi){
    // زر التصنيف
    var b = document.createElement('button');
    b.textContent = group.cat;
    if (gi === 0) b.className = 'on';
    b.addEventListener('click', function(){
      Array.prototype.forEach.call(nav.children, function(x){ x.classList.remove('on'); });
      b.classList.add('on');
      var el = document.getElementById(slug(gi));
      if (el) window.scrollTo({ top: el.offsetTop - 62, behavior: 'smooth' });
    });
    nav.appendChild(b);

    // القسم
    var sec = document.createElement('section');
    sec.id = slug(gi);
    var h = document.createElement('h2');
    h.textContent = group.cat;
    sec.appendChild(h);

    group.items.forEach(function(it){
      var row = document.createElement('div');
      row.className = 'item';

      var ico = document.createElement('div');
      ico.className = 'ico';
      ico.textContent = it.i;

      var info = document.createElement('div');
      info.className = 'info';
      var nm = document.createElement('b');
      nm.textContent = it.n;
      if (it.b){
        var bd = document.createElement('span');
        bd.className = 'badge';
        bd.textContent = it.b;
        nm.appendChild(bd);
      }
      var ds = document.createElement('p');
      ds.textContent = it.d;
      info.appendChild(nm); info.appendChild(ds);

      var pr = document.createElement('div');
      pr.className = 'price';
      pr.textContent = it.p + ' ل.س';

      row.appendChild(ico); row.appendChild(info); row.appendChild(pr);
      sec.appendChild(row);
    });

    main.appendChild(sec);
  });

  // تمييز التصنيف الظاهر أثناء التمرير
  var ticking = false;
  window.addEventListener('scroll', function(){
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function(){
      var y = window.scrollY + 110, best = 0;
      MENU.forEach(function(_, gi){
        var el = document.getElementById(slug(gi));
        if (el && el.offsetTop <= y) best = gi;
      });
      Array.prototype.forEach.call(nav.children, function(x, i){
        x.classList.toggle('on', i === best);
      });
      ticking = false;
    });
  }, { passive:true });
})();
</script>
</body>
</html>
